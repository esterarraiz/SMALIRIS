[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smaliris"
version = "1.0.0"
description = "Static Manifest Analysis and Low-level Instruction Risk Inspection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
smaliris = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["tcc_analyzer*"]

[tool.setuptools.package-data]
tcc_analyzer = ["catalog/*.json", "schemas/*.json"]
